<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>城市制霸</title>
  <meta name="description" content="标记你去过的每一座中国城市，按居住、短居、游玩、出差、路过给地级市上色，生成你的城市足迹地图">
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='26' height='24' rx='6' fill='%23FF7E7E' stroke='%23222' stroke-width='3'/%3E%3Cpath d='M9 20l5-8 4 5 3-4 3 7z' fill='%23fff' stroke='%23222' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- 字体尽早加载，避免首屏先用系统字体再闪一下 -->
  <link rel="preload" href="/fonts/cityex-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- 顶栏：面包屑 · 搜索 · 保存 -->
  <header id="topbar">
    <nav id="crumb" aria-label="当前位置">
      <button id="crumb-root" class="crumb-root">城市制霸</button>
      <span id="crumb-province" hidden><span class="sep" aria-hidden="true">›</span><button class="crumb-leaf" title="复位视图"></button></span>
    </nav>
    <div id="search" class="search" aria-expanded="false" aria-controls="locator">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input type="search" placeholder="搜索城市或省份" aria-label="搜索城市或省份" autocomplete="off" enterkeyhint="go">
    </div>
    <a id="repo" class="btn icon-btn" href="https://github.com/IdealistYu/city-ex" target="_blank" rel="noopener" aria-label="GitHub 代码仓库" title="GitHub 代码仓库">
      <svg class="solid" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <button id="save" class="btn primary" aria-label="保存全国图" title="保存全国图">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19h14"/></svg>
      <span>保存全国图</span>
    </button>
  </header>

  <div id="locator" hidden>
    <div class="locator-body"></div>
  </div>

  <main id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  </main>

  <!-- 侧栏（窄屏为底部面板）：全国视图显示统计，省视图显示本省进度、画笔、城市列表 -->
  <aside id="panel">
    <section id="stats">
      <div class="score-line">
        <div class="score"><b id="score-num">0</b><span>分</span></div>
        <div id="visited"></div>
      </div>
      <ul id="level-stats"></ul>
      <p class="tip">点击省份进入，给去过的城市标记等级</p>
      <div class="backup">
        <span>数据只保存在本浏览器</span>
        <button id="export-data" type="button" title="导出为 JSON 文件，可在本地编辑后再导入">导出</button>
        <button id="import-data" type="button" title="从 JSON 文件导入">导入</button>
        <input id="import-file" type="file" accept=".json,application/json,text/plain" hidden>
      </div>
    </section>

    <section id="province" hidden>
      <div class="province-head">
        <h2 id="province-name"></h2>
        <span id="province-progress"></span>
      </div>
      <div id="brush" role="toolbar" aria-label="画笔">
        <span class="label">画笔<small>选中后点城市直接涂色</small></span>
        <div class="options"></div>
      </div>
      <div id="city-list"></div>
    </section>
  </aside>

  <div id="picker" role="dialog" aria-labelledby="picker-title" hidden>
    <h2 id="picker-title"></h2>
    <div class="options"></div>
  </div>

  <div id="output" role="dialog" aria-modal="true" aria-label="导出的图片" hidden>
    <img alt="城市制霸">
    <p>手机端可长按图片保存</p>
    <button class="btn">关闭</button>
  </div>

  <!-- 导入：本机已有数据时选择合并或替换 -->
  <dialog id="import-dialog" aria-labelledby="import-title">
    <form method="dialog">
      <h2 id="import-title">导入数据</h2>
      <p class="summary"></p>
      <p class="skipped" hidden></p>
      <ul class="modes">
        <li><b>合并</b>保留现有标记，同一城市取较高的等级</li>
        <li><b>替换</b>清空现有标记，只保留文件里的</li>
      </ul>
      <div class="actions">
        <button value="cancel" class="btn">取消</button>
        <button value="replace" class="btn">替换</button>
        <button value="merge" class="btn primary" autofocus>合并</button>
      </div>
    </form>
  </dialog>

  <!-- 导出：内置浏览器无法下载文件时，改为展示文本供复制 -->
  <dialog id="export-dialog" aria-labelledby="export-title">
    <form method="dialog">
      <h2 id="export-title">导出数据</h2>
      <p>当前浏览器不支持下载文件，请复制下面的内容保存到备忘录等地方，之后可粘贴成 .json 文件导入。</p>
      <textarea readonly rows="10"></textarea>
      <div class="actions">
        <button value="close" class="btn">关闭</button>
        <button type="button" id="copy-data" class="btn primary">复制</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="noscript">城市制霸需要开启 JavaScript 才能使用。</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
